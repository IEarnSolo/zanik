stages:
  - test
  - build
  - package
  - validate
  - release
  - distribute

default:
  image: debian:bookworm-slim
  tags: [docker]
  interruptible: true
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends ca-certificates curl g++ git make nodejs python3 unzip xz-utils zip

variables:
  DEBIAN_FRONTEND: noninteractive

test-core:
  stage: test
  script:
    - make clean
    - make test-core

verify-release-tag:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - python3 tools/release_contract.py --tag "$CI_COMMIT_TAG" --require-clean

build-linux:
  stage: build
  script:
    - make clean
    - make all
    - sha256sum dist/libdwstatus.so dist/zanik-compat-analyzer > dist/SHA256SUMS
  artifacts:
    name: "zanik-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    expose_as: "Zanik Linux binaries"
    expire_in: 30 days
    paths: [dist/libdwstatus.so, dist/zanik-compat-analyzer, dist/SHA256SUMS]

.package-release-base:
  stage: package
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends ca-certificates curl gcc-mingw-w64-x86-64 osslsigncode python3 unzip xz-utils zip
  needs:
    - job: build-linux
      artifacts: true
  script:
    - chmod +x scripts/*.sh scripts/zanik-server
    - RELEASE_TAG="${CI_COMMIT_TAG:-}" RELEASE_COMMIT="$CI_COMMIT_SHA" SOURCE_DATE_EPOCH="$(date -d "$CI_COMMIT_TIMESTAMP" +%s)" scripts/package-release.sh dist/release

package-release:
  extends: .package-release-base
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  artifacts:
    name: "zanik-release-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths:
      - dist/release/zanik-server-*
      - dist/release/zanik-asset-tools-*
      - dist/release/SHA256SUMS
      - dist/release/release-manifest.json

package-manager:
  extends: .package-release-base
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  artifacts:
    name: "zanik-manager-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths: [dist/release/zanik-manager-windows-x86_64-*.zip]

package-release-tag:
  extends: .package-release-base
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    name: "zanik-release-${CI_COMMIT_TAG}"
    expire_in: never
    paths:
      - dist/release/zanik-server-*
      - dist/release/zanik-asset-tools-*
      - dist/release/SHA256SUMS
      - dist/release/release-manifest.json
      - dist/release/release-notes.md

package-manager-tag:
  extends: .package-release-base
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    name: "zanik-manager-${CI_COMMIT_TAG}"
    expire_in: never
    paths: [dist/release/zanik-manager-windows-x86_64-*.zip]

validate-release:
  stage: validate
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  needs:
    - job: package-release
      artifacts: true
    - job: package-manager
      artifacts: true
  script:
    - python3 tools/validate_release.py --directory dist/release
    - cd dist/release && sha256sum --check SHA256SUMS

validate-release-tag:
  stage: validate
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: package-release-tag
      artifacts: true
    - job: package-manager-tag
      artifacts: true
  script:
    - python3 tools/validate_release.py --directory dist/release --tag "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA"
    - python3 tools/release_contract.py --tag "$CI_COMMIT_TAG"
    - cd dist/release && sha256sum --check SHA256SUMS

publish-gitlab-packages:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: package-release-tag
      artifacts: true
    - job: package-manager-tag
      artifacts: true
    - job: validate-release-tag
      artifacts: false
  script:
    - VERSION="$(tr -d '\r\n' < VERSION)"
    - python3 tools/publish_gitlab_package.py --directory dist/release --version "$VERSION" --links-output dist/release/assets-links.json
  artifacts:
    expire_in: never
    paths: [dist/release/assets-links.json, dist/release/release-notes.md]

create-gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  before_script: []
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: publish-gitlab-packages
      artifacts: true
  script:
    - VERSION="$(tr -d '\r\n' < VERSION)"
    - glab release create "$CI_COMMIT_TAG" --name "Zanik $VERSION" --notes-file dist/release/release-notes.md --ref "$CI_COMMIT_SHA" --assets-links="$(cat dist/release/assets-links.json)"

publish-github-release:
  stage: distribute
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  resource_group: github-production
  environment:
    name: github-production
  needs:
    - job: package-release-tag
      artifacts: true
    - job: package-manager-tag
      artifacts: true
    - job: create-gitlab-release
      artifacts: false
  script:
    - VERSION="$(tr -d '\r\n' < VERSION)"
    - python3 tools/publish_github_release.py --directory dist/release --version "$VERSION" --tag "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA" --notes dist/release/release-notes.md --repository IEarnSolo/zanik --report dist/release/github-release.json
  artifacts:
    when: always
    expire_in: never
    paths: [dist/release/github-release.json]

publish-curseforge:
  stage: distribute
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  manual_confirmation: "Submit this validated release to CurseForge moderation?"
  resource_group: curseforge-production
  environment:
    name: curseforge-production
  needs:
    - job: package-release-tag
      artifacts: true
    - job: package-manager-tag
      artifacts: true
    - job: create-gitlab-release
      artifacts: false
  script:
    - |
      VERSION="$(tr -d '\r\n' < VERSION)"
      set -- --directory dist/release --version "$VERSION" --tag "$CI_COMMIT_TAG" --changelog dist/release/release-notes.md --report dist/release/curseforge-upload.json
      if [ -n "${CURSEFORGE_PRIMARY_FILE_ID:-}" ]; then set -- "$@" --primary-file-id "$CURSEFORGE_PRIMARY_FILE_ID"; fi
      old_ifs=$IFS; IFS=,
      # Historical variable names remain supported for safe partial-upload recovery.
      for role in ${CURSEFORGE_SKIP_CHILDREN:-}; do [ -n "$role" ] && set -- "$@" --skip-child "$role"; done
      IFS=$old_ifs
      python3 tools/curseforge_upload.py "$@"
  artifacts:
    when: always
    expire_in: never
    paths: [dist/release/curseforge-upload.json]
