stages:
  - test
  - build
  - package
  - validate

default:
  image: debian:bookworm-slim
  tags:
    - docker
  interruptible: true
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends ca-certificates curl g++ make nodejs python3 unzip xz-utils zip

variables:
  DEBIAN_FRONTEND: noninteractive

test-core:
  stage: test
  script:
    - make clean
    - make test-core

build-linux:
  stage: build
  script:
    - make clean
    - make all
    - sha256sum dist/libdwstatus.so dist/zanik-compat-analyzer > dist/SHA256SUMS
  artifacts:
    name: "zanik-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    expose_as: "Zanik Linux binaries"
    expire_in: 30 days
    paths:
      - dist/libdwstatus.so
      - dist/zanik-compat-analyzer
      - dist/SHA256SUMS

package-release:
  stage: package
  needs:
    - job: build-linux
      artifacts: true
  script:
    - chmod +x scripts/*.sh scripts/zanik-server
    - SOURCE_DATE_EPOCH="$(date -d "$CI_COMMIT_TIMESTAMP" +%s)" scripts/package-release.sh dist/release
  artifacts:
    name: "zanik-release-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    expose_as: "Validated release candidates"
    expire_in: 30 days
    paths:
      - dist/release/

validate-release:
  stage: validate
  needs:
    - job: package-release
      artifacts: true
  script:
    - python3 tools/validate_release.py --directory dist/release
    - cd dist/release && sha256sum --check SHA256SUMS
